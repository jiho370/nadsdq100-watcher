# =============================================================================
# 데일리(2통)·주간 시장 리포트 (GitHub Actions — PC 꺼져 있어도 자동 발송)
#
# 스케줄 (Actions cron 은 UTC · KST = UTC+9 · 실제 실행은 수 분 지연될 수 있음):
#   ⚠ 2026-07-29: 정각(00분) cron은 GitHub 자체 문서가 경고하는 최혼잡 시간대라 실제로 크게
#     지연되는 걸 이틀 연속 실측(미장 UTC15:00→+1h43m 지연, 국장 UTC01:00→21분+ 지연 후에도
#     안 뜸). 그래서 두 cron 모두 분을 07분으로 옮겨 정각 혼잡을 피한다(KST 발송시각은
#     10:00→10:07, 00:00→00:07대로 7분 밀릴 뿐 — 실질적 의미 없는 오차).
#   · 한국장 메일: UTC 00:40 월~금 = KST 09:40 월~금 (2026-07-30 10:07→09:40 이관, 지호 님
#     요청 — 스케줄 지연/드롭(위 §워치독)까지 감안한 "확실한 도착 시각"을 앞당기려고 시세
#     신선도(개장 1시간 안정화)보다 이른 도착을 우선. 개장(09:00) 40분 후라 07-28에 노렸던
#     "1시간 안정화" 효과는 약해짐 — 인지하고 채택한 트레이드오프. 종목 "선정"에 쓰이는
#     펀더멘탈(PER/PBR/배당)은 KRX가 장중에 당일치를 안 올려 여전히 전일 기준 — 이 이관으로
#     좋아지는/영향받는 건 가격 표시 쪽뿐, kr_stocks.py 참고)
#   · 미국장 메일: UTC 15:07 월~금 = KST 00:07대(다음날) 화~토 (2026-07-28 마감→개장 이관,
#     지호 님 요청 — 종가 대신 개장 30분~90분 후 시가 기준. 근거: STRATEGY.md §7, 9년
#     포트폴리오 백테스트에서 시가/종가 수익률 차이가 통계적으로 무의미함을 확인).
#     ⚠ DST: 미국 동부는 서머타임(UTC-4/-5)을 쓰는데 KST는 안 써서, 이 cron이 "개장+30분"이
#     되는 건 미국 표준시(11~3월)뿐이고 서머타임(3~11월)엔 "개장+90분"이 된다(15:07 UTC
#     고정 — 장 시작 전에 뜨는 사고를 막는 게 정확히 30분보다 우선이라 늦은 쪽으로 잡음).
#     ⚠ KST 자정 교차: 15:07 UTC=00:07 KST 다음날이라, "월요일 개장" 리포트는 화요일
#     00:00대에 도착한다(요일이 전부 하루씩 밀림) — 지호 님이 이 결과(화~토 도착, 월요일엔
#     월요일 고유 메일 없음·금요일 개장분이 토요일 00:00대 도착)를 그대로 수용하기로
#     결정(2026-07-28) — 2026-07-27에 정했던 "토→월 이관"(종가 기준 설계 당시 결정)은
#     이 개장 기준 이관으로 대체됨.
#     pregen.py의 run_us는 이 자정 교차를 감안해 낮 시간대 실행분의 for_kst를 "다음날"로
#     찍는다(그래야 화요일 00:00대 발송이 월요일 낮에 만든 pregen 캐시를 정확히 찾는다).
#   · 주간 배분:   UTC 22:30 토    = KST 07:30 일
#   어느 cron 이 깨웠는지(github.event.schedule)로 --kr / --us / --weekly 를 분기한다.
#   ⚠ 2026-07-29 워치독 추가, 07-30 간격 45분→25분으로 단축(지호 님 지시 — "씹히면 좀 더
#     빨리 재시도하자"): 07분 이동으로도 국장·미장 cron이 아예 미실행되는 사고가 반복됨
#     (GitHub Actions 자체 인프라 장애, githubstatus.com 7/29 인시던트와 시점 일치. 국장은
#     07-30 아침에도 재발 — 10:07 목표가 10:33까지도 미실행). 각 primary 25분 뒤에 재시도
#     cron(kr 10:05·us 00:32대·weekly 07:55 KST)을 추가(국장 primary는 이후 09:40으로
#     추가 이관 — 아래 참고). daily_ai_report.py의
#     last_sent.json 날짜 가드가 이미 보낸 건 자동 스킵하므로 중복발송 걱정 없이 "primary가
#     씹히면 워치독이 대신 보낸다" 안전망으로만 작동한다. ⚠ 다만 이 워치독도 결국 같은
#     `schedule` 트리거라 GitHub 공식 문서상 "고부하 시 드롭될 수 있다"는 한계는 동일하게
#     적용된다 — 25분도 100% 보장은 아니고, 재발하면 지호 님이 알려주는 대로 즉시 수동
#     발송(workflow_dispatch)으로 대응 중.
#
# 비용: 전날 밤/당일 아침 PC 의 pregen_{kr,us}.json 이 있으면 웹검색 검증 생략(haiku만),
#   없으면 sonnet 검증 폴백. 모델·검색 한도는 아래 env.
#
# 필요한 저장소 Secrets (Settings > Secrets and variables > Actions):
#   SMTP_USER          Gmail 주소
#   SMTP_PASS          Gmail 앱 비밀번호
#   EMAIL_TO           수신자(쉼표로 여러 명)
#   ANTHROPIC_API_KEY  AI 해설용 — 2026-07-10 기준 미사용(아래 env에서 주석 처리, AI_ENABLED=0).
#                      pregen(로컬 PC, 구독 CLI)이 있으면 그 캐시로, 없으면 지표 기반
#                      해설(deterministic_report)로 자동 대체 — 발송은 계속됨. 나중에 API를
#                      다시 쓰려면 아래 env 블록의 주석을 풀고 이 Secret에 키를 등록.
#
# 상태 영속화: 러너는 매번 초기화되므로 output/ 의 상태 json(보유목록·발송기록·KRX캐시)을
#   실행 후 저장소에 commit-back 한다.
# =============================================================================

name: Daily & Weekly Market Report

on:
  schedule:
    - cron: "40 0 * * 1-5"    # KST 월~금 09:40 — 한국장 메일(2026-07-30: 시세신선도보다 이른 도착 우선)
    - cron: "7 15 * * 1-5"    # KST 00:07대(다음날) 화~토 — 미국장 개장 메일(정각 혼잡 회피로 +7분)
    - cron: "30 22 * * 6"     # KST 일 07:30 — 주간 자산배분
    # ── 코인전용(2026-08-23 구현, docs/superpowers/specs/2026-08-03-coin-only-mail-design.md
    #   — 2026-08-03 승인 후 뒤늦게 구현): 비트코인 24/7 거래인데 미장 메일이 토요일(금요일
    #   마감)~화요일(월요일 마감) 사이 약 2.5~3일 신호 공백이 생겨 토·일·월 아침에 BTC+ETH
    #   레짐 신호만 별도 발송(정각 혼잡 회피로 +7분, 기존 관행과 동일).
    - cron: "7 0 * * 6"       # KST 토 09:07 — 코인전용
    - cron: "7 0 * * 0"       # KST 일 09:07 — 코인전용
    - cron: "7 0 * * 1"       # KST 월 09:07 — 코인전용
    # ── 워치독(2026-07-29 추가): 위 세 cron이 GitHub 측 혼잡으로 지연·드롭되는 사고가
    #   반복 확인돼(§ 상단 참고, 국장 cron은 21분+ 지연 후 아예 미실행) 각 primary 45분
    #   전후로 재시도 cron을 추가한다. daily_ai_report.py의 last_sent.json 날짜 가드가
    #   이미 발송된 건 자동으로 스킵하므로("[중복] ... 이미 발송 → 생략") primary가
    #   정상 실행됐으면 이 워치독은 그냥 조용히 아무것도 안 하고 끝난다 — 중복발송 위험 없음.
    #   (코인전용은 설계 문서 범위상 워치독 없이 시작 — 필요성 실측되면 후속 추가.)
    - cron: "5 1 * * 1-5"     # KST 10:05 — 한국장 워치독(+25분)
    - cron: "32 15 * * 1-5"   # KST 00:32대(다음날) — 미국장 워치독(+25분)
    - cron: "55 22 * * 6"     # KST 일 07:55 — 주간 워치독(+25분)
    # ── 2차 워치독(2026-08-27 추가, 지호 님 지적 — "국장 안 옴, 어제 미장도 안 와서 수동으로
    #   했는데"): 같은 날 primary+워치독(+25분)이 둘 다 드롭되는 사고가 한 주에 여러 번
    #   재발함(2026-08-25 미장, 2026-08-26 미장, 2026-08-27 국장 — 실행 자체가 아예 안 만들어짐,
    #   위 §워치독 문단의 "지연"보다 심한 "미실행"). +25분 한 번으로는 부족하다고 판단해
    #   primary로부터 +2시간 뒤 한 번 더 재시도(총 3회 기회). last_sent.json 가드가 그대로라
    #   앞서 primary나 1차 워치독이 정상 발송했으면 이것도 조용히 스킵 — 중복발송 위험 없음.
    - cron: "40 2 * * 1-5"    # KST 11:40 — 한국장 2차 워치독(+2시간)
    - cron: "7 17 * * 1-5"    # KST 02:07대(다음날) — 미국장 2차 워치독(+2시간)
    - cron: "30 0 * * 0"      # KST 일 09:30 — 주간 2차 워치독(+2시간)
  workflow_dispatch:
    inputs:
      mode:
        description: "강제 모드: kr / us / coin / weekly / daily(둘 다) / preview(발송 없음)"
        required: false
        default: ""

permissions:
  contents: write               # 상태파일 commit-back용

concurrency:
  group: market-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Korean font (2026-08-24 — 차트 제목 한글 깨짐 수정)
        # ubuntu-latest 러너엔 한글 폰트가 기본 없어(daily_ai_report.py 상단 _KFONT 탐색이
        # 전부 실패) 매플롯립 차트 제목(추세신호 카드 등)의 한글이 깨진 사각형(tofu)으로
        # 렌더링됐다(§11-4, 코인전용 메일 실발송으로 발견). 한국 개별종목 차트는 종목코드
        # 대신 회사명(한글)을 쓰는 게 의도된 설계(코드는 사람이 못 알아봄)라 영문 대체 대신
        # 폰트 자체를 설치해 근본 해결. fonts-nanum은 우분투 표준 저장소 패키지(가벼움).
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-nanum
          fc-cache -f

      - name: Run report and send email
        env:
          # ── AI 해설: 2026-07-10부터 일단 비활성(API 없이 최대한 자동화 — pregen 캐시 +
          #   deterministic_report만으로 발송). 다시 켜려면 AI_ENABLED 줄 지우고 아래 5줄
          #   주석 해제 + Secrets에 ANTHROPIC_API_KEY 등록.
          AI_ENABLED: "0"
          # AI_BACKEND: "api"
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # REPORT_MODEL_VERIFY: "claude-sonnet-5"
          # REPORT_MODEL_WRITE: "claude-haiku-4-5"
          # REPORT_WEB: "1"            # 웹검색으로 뉴스 보강(비용 아끼려면 "0")
          # REPORT_WEB_USES: "4"       # 검색이 최대 비용원 — 묶음 검색 4회로 제한
          # AI_TIMEOUT: "900"
          # ── 발송
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO:  ${{ secrets.EMAIL_TO }}
          # ── 한국 종목(pykrx, 2025-12-27부터 KRX Data Marketplace 로그인 필수로 바뀜)
          # 없으면 코스피200 섹션이 빈 채로 발송됨(에러는 아님). data.krx.co.kr 가입 후 등록.
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          # ── 전략 파라미터 (STRATEGY.md, 2026-07 재검증) — 기본 매도: 6개월 정기재평가 +
          #   200일선 -3% 백업. 트레일링은 순수익을 절반으로 깎는 것으로 확인되어 폐기,
          #   env 자체를 지정하지 않아 holdings.py 기본값(SELL_TRAIL=0, 비활성)을 따른다.
          SELL_MA_BUFFER: "0.03"     # 200일선 -3% 이탈
        run: |
          MODE="${{ github.event.inputs.mode }}"
          SCHED="${{ github.event.schedule }}"
          # 수동 실행(mode 입력) 우선, 스케줄 실행이면 어느 cron 인지로 분기
          if [ -z "$MODE" ]; then
            case "$SCHED" in
              "40 0 * * 1-5")  MODE="kr" ;;
              "5 1 * * 1-5") MODE="kr" ;;       # 국장 워치독
              "40 2 * * 1-5") MODE="kr" ;;      # 국장 2차 워치독(+2시간)
              "7 15 * * 1-5")  MODE="us" ;;
              "32 15 * * 1-5") MODE="us" ;;       # 미장 워치독
              "7 17 * * 1-5") MODE="us" ;;        # 미장 2차 워치독(+2시간)
              "30 22 * * 6") MODE="weekly" ;;
              "55 22 * * 6") MODE="weekly" ;;     # 주간 워치독
              "30 0 * * 0") MODE="weekly" ;;      # 주간 2차 워치독(+2시간)
              "7 0 * * 6") MODE="coin" ;;         # 코인전용(토)
              "7 0 * * 0") MODE="coin" ;;         # 코인전용(일)
              "7 0 * * 1") MODE="coin" ;;         # 코인전용(월)
            esac
          fi
          case "$MODE" in
            kr)      python daily_ai_report.py --kr ;;
            us)      python daily_ai_report.py --us ;;
            coin)    python daily_ai_report.py --coin ;;
            weekly)  python daily_ai_report.py --weekly ;;
            daily)   python daily_ai_report.py --daily --force ;;
            preview) python daily_ai_report.py --daily --no-email ;;
            *)       python daily_ai_report.py ;;   # 폴백: KST 시간 자동 분기
          esac

      - name: Upload preview artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-preview
          path: output/*.html
          if-no-files-found: ignore

      - name: Persist state (holdings·last_sent·KRX cache)
        if: ${{ always() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/ai_holdings.json output/kr_holdings.json \
                     output/last_sent.json output/kospi200_cache.json 2>/dev/null || true
          git add state_prev_list.json 2>/dev/null || true
          # 2026-07-13 수정: `git status --porcelain --cached`는 존재하지 않는 옵션 조합이라
          # 항상 에러("unknown option `cached'")로 실패해 stdout이 비고, 그 결과 상태 변경이
          # 있어도 매번 "변경 없음"으로 오판해 커밋이 한 번도 안 됐다(last_sent.json이 git
          # 히스토리에 전무했던 원인 — 중복발송 가드가 Actions에서는 사실상 무력화돼 있었음).
          # 스테이징된 변경 유무는 git diff --cached --quiet(변경 있으면 종료코드 1)로 판단.
          if ! git diff --cached --quiet; then
            git commit -m "chore: update report state [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push
          else
            echo "상태 변경 없음 - 커밋 생략"
          fi
